<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Reminder app icon.

    Concept: an open cycle arc (the recurring reminder) wrapped around a seated
    figure reclining backward (the pressure-relief posture change the app exists
    to prompt). Drawn as vector rather than generated so stroke weights stay
    even and the mark holds up at 16pt in the menu bar.

    The rounded-square face bleeds to the full canvas: macOS applies its own
    mask and shadow, so the artwork must not carry its own.

    Geometry note: the ring is centred at (512,512) with r=286. The arc ends at
    the 40-degree point, and the arrowhead is built on that point's tangent so
    the head sits on the ring rather than floating beside it.
  -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#42B0AA"/>
      <stop offset="55%" stop-color="#2E8C93"/>
      <stop offset="100%" stop-color="#1F6675"/>
    </linearGradient>
    <!-- A soft inner highlight keeps the flat face from looking dead. -->
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon face, full-bleed. -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#face)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <g fill="none" stroke="#FDF6E4" stroke-linecap="round" stroke-linejoin="round"
     stroke-width="52">
    <!--
      Cycle ring, open at the top right. The gap alone carries the sense of a
      repeating cycle; an arrowhead was tried here and dropped, because at this
      stroke weight it crowded the figure and blunted into a fork shape.
    -->
    <path d="M 512 226 A 286 286 0 1 0 718 313"/>
  </g>

  <!--
    Seated figure in profile, reclining backward. Drawn as one continuous
    stroke from shoulder through hip to knee to foot, so it reads as a single
    body rather than disconnected limbs.
  -->
  <g fill="none" stroke="#FDF6E4" stroke-linecap="round" stroke-linejoin="round"
     stroke-width="50">
    <path d="M 556 447 L 612 596 L 452 618 L 408 706"/>
  </g>
  <!-- Head, sitting just off the top of the reclining torso. -->
  <circle cx="536" cy="378" r="52" fill="#FDF6E4"/>
</svg>
